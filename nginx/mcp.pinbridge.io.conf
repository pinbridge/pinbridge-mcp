# Nginx vhost for PinBridge MCP when nginx runs on the host and proxies
# to the Docker-published MCP port on localhost.
#
# Assumptions:
# - The MCP container publishes port 57289 on the host.
# - DNS for mcp.pinbridge.io already points to this host.
#
# If nginx itself runs inside Docker on the same user-defined network as the
# `mcp` service, change `proxy_pass` to `http://mcp:57289;`.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.pinbridge.io;

    access_log /var/log/nginx/pinbridge-mcp.access.log;
    error_log /var/log/nginx/pinbridge-mcp.error.log warn;

    client_max_body_size 10m;
    keepalive_timeout 75s;

    location / {
        proxy_pass http://127.0.0.1:57289;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MCP streamable HTTP can hold long-lived responses; buffering breaks that behavior.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
