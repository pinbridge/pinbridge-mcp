[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pinbridge-mcp"
version = "1.0.0"
description = "Remote and local MCP server for PinBridge"
authors = ["PinBridge"]
readme = "README.md"
packages = [{ include = "pinbridge_mcp", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
httpx = ">=0.27.0,<1"
mcp = { version = ">=1.26.0,<2", extras = ["cli"] }
pinbridge-sdk = ">=1.8.0,<2"
pydantic = ">=2.6.0,<3"
pydantic-settings = ">=2.6.0,<3"
uvicorn = ">=0.30.0,<1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9"
pytest-asyncio = ">=0.23.0,<1"
ruff = ">=0.8.0,<1"

[tool.poetry.scripts]
pinbridge-mcp = "pinbridge_mcp.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
