services:
  mcp:
    build:
      context: .
    image: pinbridge-mcp:local
    container_name: pinbridge_mcp
    ports:
      - "57289:57289"
    environment:
      PINBRIDGE_MCP_HOST: 0.0.0.0
      PINBRIDGE_MCP_PORT: 57289
      PINBRIDGE_MCP_PINBRIDGE_BASE_URL: ${PINBRIDGE_MCP_PINBRIDGE_BASE_URL:-https://api.pinbridge.io}
      PINBRIDGE_MCP_PINBRIDGE_API_KEY: ${PINBRIDGE_MCP_PINBRIDGE_API_KEY:-}
      PINBRIDGE_MCP_VERIFY_INCOMING_API_KEYS: ${PINBRIDGE_MCP_VERIFY_INCOMING_API_KEYS:-true}
      PINBRIDGE_MCP_AUTH_CACHE_TTL_SECONDS: ${PINBRIDGE_MCP_AUTH_CACHE_TTL_SECONDS:-60}
      PINBRIDGE_MCP_STREAMABLE_HTTP_PATH: ${PINBRIDGE_MCP_STREAMABLE_HTTP_PATH:-/}
      PINBRIDGE_MCP_ENABLE_WRITE_TOOLS: ${PINBRIDGE_MCP_ENABLE_WRITE_TOOLS:-false}
      PINBRIDGE_MCP_LOG_LEVEL: ${PINBRIDGE_MCP_LOG_LEVEL:-INFO}
    networks:
      - pinbridge

  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    container_name: pinbridge_mcp_postgres
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pin-bridge}
      POSTGRES_DB: ${POSTGRES_DB:-pinbridge}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinbridge

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    container_name: pinbridge_mcp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinbridge

  api:
    profiles: ["full"]
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: pinbridge_mcp_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8976:8000"
    env_file:
      - ../api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pinbridge}:${POSTGRES_PASSWORD:-pin-bridge}@postgres:5432/${POSTGRES_DB:-pinbridge}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-pinbridge}:${POSTGRES_PASSWORD:-pin-bridge}@postgres:5432/${POSTGRES_DB:-pinbridge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ../api/app:/app/app
      - ../api/migrations:/app/migrations
      - ../api/alembic.ini:/app/alembic.ini
      - asset_data:/app/.data/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - pinbridge

  worker:
    profiles: ["full"]
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: pinbridge_mcp_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ../api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pinbridge}:${POSTGRES_PASSWORD:-pin-bridge}@postgres:5432/${POSTGRES_DB:-pinbridge}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-pinbridge}:${POSTGRES_PASSWORD:-pin-bridge}@postgres:5432/${POSTGRES_DB:-pinbridge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ../api/app:/app/app
      - asset_data:/app/.data/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pinbridge

  scheduler:
    profiles: ["full"]
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: pinbridge_mcp_scheduler
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - ../api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pinbridge}:${POSTGRES_PASSWORD:-pin-bridge}@postgres:5432/${POSTGRES_DB:-pinbridge}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-pinbridge}:${POSTGRES_PASSWORD:-pin-bridge}@postgres:5432/${POSTGRES_DB:-pinbridge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ../api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pinbridge

networks:
  pinbridge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  asset_data:
